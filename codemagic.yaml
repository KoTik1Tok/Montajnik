@"
workflows:
  ios-release:
    name: iOS Release
    environment:
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcworkspace"
        XCODE_SCHEME: "iosApp"
        BUNDLE_ID: "com.example.myapp"
      node: latest
    scripts:
      - name: Build iOS framework (KMP)
        script: |
          ./gradlew shared:linkReleaseFrameworkIosArm64 -Pkotlin.native.cocoapods.platformVersion=14.0
      - name: Build and archive iOS app
        script: |
          xcodebuild -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$(pwd)/build/ios.xcarchive" \
            archive
      - name: Export .ipa
        script: |
          xcodebuild -exportArchive \
            -archivePath "$(pwd)/build/ios.xcarchive" \
            -exportPath "$(pwd)/build/ios.ipa" \
            -exportOptionsPlist iosApp/ExportOptions.plist
    artifacts:
      - build/ios.ipa
    publishing:
      email:
        recipients:
          - your_email@example.com
"@ | Out-File -FilePath codemagic.yaml -Encoding utf8