workflows:
  ios-release:
    name: iOS Release
    environment:
      vars:
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
        BUNDLE_ID: "com.example.myapp"
      node: latest
    scripts:
      - name: Build iOS framework (KMP)
        script: |
          chmod +x gradlew
          ./gradlew shared:linkReleaseFrameworkIosArm64 -Pkotlin.native.cocoapods.platformVersion=14.0
      - name: Build .app (unsigned)
        script: |
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -derivedDataPath build/derived \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Create .ipa from .app
        script: |
          APP_PATH="build/derived/Build/Products/Release-iphoneos/iosApp.app"
          IPA_PATH="build/ios.ipa"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r ios.ipa Payload/
      - name: Upload .ipa as artifact
        script: |
          # Артефакты собираются автоматически из папки build
    artifacts:
      - build/ios.ipa
    publishing:
      email:
        recipients:
          - your_email@example.com
